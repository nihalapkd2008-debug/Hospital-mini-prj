{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-user-plus"></i> Add Patient</h1>
        </div>

        <div class="booking-card">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Name</label>
                    <input type="text" name="name" placeholder="Enter patient name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> Age</label>
                    <input type="number" name="age" placeholder="Enter age" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone</label>
                    <input type="text" name="phone" placeholder="Enter phone number" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-notes-medical"></i> Disease</label>
                    <input type="text" name="disease" placeholder="Enter disease" class="form-input" required>
                </div>
                <div class="form-actions">
                    <a href="{% url 'patient_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Add Patient
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
