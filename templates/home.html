{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Home Page Specific Styles (Overrides base style for hero section) */
    .hero-section {
        min-height: 85vh; /* മുഴുവൻ സ്ക്രീൻ ഉയരത്തിൽ ഹീറോ സെക്ഷൻ */
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #0e1a2b 0%, #05101f 100%);
        text-align: center;
        padding: 4rem 1.5rem;
        position: relative;
        overflow: hidden;
        width: 100%;
    }

    /* Background Glow Effects */
    .hero-section::before {
        content: '';
        position: absolute;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 80%;
        background: radial-gradient(circle, rgba(0, 180, 216, 0.15) 0%, transparent 70%);
        filter: blur(80px);
        z-index: 0;
    }

    .hero-section::after {
        content: '';
        position: absolute;
        bottom: -20%;
        right: -10%;
        width: 60%;
        height: 80%;
        background: radial-gradient(circle, rgba(0, 119, 182, 0.1) 0%, transparent 70%);
        filter: blur(80px);
        z-index: 0;
    }

    /* Content Wrapper */
    .hero-content {
        position: relative;
        z-index: 10;
        max-width: 900px;
    }

    .hero-badge {
        display: inline-block;
        background: rgba(0, 180, 216, 0.15);
        border: 1px solid rgba(0, 180, 216, 0.3);
        color: #90e0ef;
        padding: 0.5rem 1.5rem;
        border-radius: 30px;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        backdrop-filter: blur(4px);
    }

    .hero-title {
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        line-height: 1.1;
        color: #ffffff;
        font-family: 'Cinzel', serif; /* ഇത് നിങ്ങളുടെ base.html ഫോണ്ട് ഉപയോഗിക്കും */
    }

    .hero-title span {
        color: #00b4d8;
    }

    .hero-subtitle {
        font-size: 1.5rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 2.5rem;
    }

    .hero-features {
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        margin-bottom: 3rem;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
    }

    .hero-features i {
        color: #00b4d8;
        margin-right: 8px;
    }

    .hero-buttons {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
    }

    /* Base-ലെ ബട്ടണുകൾക്കൊപ്പം പ്രവർത്തിക്കാൻ */
    .btn-primary {
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: white;
        border: none;
        padding: 1rem 2.5rem;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 180, 216, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(0, 180, 216, 0.5);
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 1rem 2.5rem;
        border-radius: 50px;
        font-weight: 500;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
    }

    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-3px);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .hero-title {
            font-size: 2.8rem;
        }
        .hero-subtitle {
            font-size: 1.2rem;
        }
        .hero-features {
            flex-direction: column;
            gap: 1rem;
        }
        .hero-buttons {
            flex-direction: column;
            align-items: center;
        }
    }
</style>

<!-- Hero Section -->
<section class="hero-section">
    <div class="hero-content" data-aos="fade-up">
        <div class="hero-badge">
            <i class="fas fa-shield-alt"></i> Trusted Healthcare Provider
        </div>
        <h1 class="hero-title">
            Welcome to<br>
            <span>AUREA CLINIC</span>
        </h1>
        <p class="hero-subtitle">Healthcare Management System</p>
        
        <div class="hero-features">
            <span><i class="fas fa-heart"></i> Compassion</span>
            <span><i class="fas fa-user-nurse"></i> Care</span>
            <span><i class="fas fa-star"></i> Excellence</span>
        </div>

        <div class="hero-buttons">
            <!-- നിങ്ങളുടെ patients app-ലേക്കുള്ള ലിങ്കുകൾ -->
            <a href="{% url 'patient_list' %}" class="btn-primary">
                <i class="fas fa-users"></i> View Patients
            </a>
            <a href="{% url 'appointment_list' %}" class="btn-secondary">
                <i class="fas fa-calendar-plus"></i> Book Appointment
            </a>
        </div>
    </div>
</section>

{% endblock %}
