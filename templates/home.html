<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <!-- Google Font & Font Awesome for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 10%, #f8f9ff 0%, #e9ecf8 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1.5rem;
        }

        /* Navigation Styles - Matching Dashboard */
        .navbar {
            width: 100%;
            max-width: 480px;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            box-shadow: 0 10px 30px -12px rgba(0, 20, 40, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        .navbar:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px -14px rgba(0, 20, 40, 0.25);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e1b4b;
            text-decoration: none;
        }

        .navbar-brand i {
            color: #7c3aed;
            font-size: 1.3rem;
        }

        .navbar-brand span {
            background: linear-gradient(145deg, #1e1b4b, #312e81);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            list-style: none;
        }

        .nav-links li {
            display: inline;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            text-decoration: none;
            color: #4b3d8a;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .nav-link i {
            font-size: 0.9rem;
        }

        .nav-link:hover {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
            transform: translateY(-1px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.3);
        }

        .nav-link.active:hover {
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
            color: white;
            transform: scale(0.98);
        }

        .nav-divider {
            width: 1px;
            height: 24px;
            background: linear-gradient(180deg, transparent, rgba(167, 139, 250, 0.3), transparent);
            margin: 0 0.2rem;
        }

        /* Profile Card Styles */
        .profile-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            padding: 2.5rem 2rem 2.8rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25),
                        0 8px 24px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 70px -18px rgba(0, 20, 40, 0.35);
        }

        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1.2rem;
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #a78bfa, #7c3aed, #4f46e5, #7c3aed, #a78bfa);
            opacity: 0.7;
            filter: blur(2px);
            animation: spinGlow 12s linear infinite;
            z-index: 0;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            position: relative;
            z-index: 2;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 25px -8px rgba(79, 70, 229, 0.3);
            background: #f0f2ff;
            display: block;
            transition: transform 0.3s ease;
        }

        .avatar-img:hover {
            transform: scale(1.02);
        }

        .fallback-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.6rem;
            font-weight: 500;
            border: 4px solid white;
            box-shadow: 0 10px 25px -8px rgba(79, 70, 229, 0.3);
            margin: 0 auto;
        }

        .fallback-avatar i {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .username {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #1e1b4b, #312e81);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.25rem;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .info-group {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 1.5rem 1.8rem;
            margin: 1.4rem 0 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.6);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.4rem 0;
            font-size: 1.05rem;
            color: #1f1b3e;
        }

        .info-item i {
            width: 1.8rem;
            color: #6d5fd3;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(109, 95, 211, 0.15);
        }

        .info-item strong {
            font-weight: 600;
            color: #1e1b4b;
            margin-right: 0.15rem;
        }

        .info-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a78bfa, transparent);
            margin: 0.5rem auto;
            opacity: 0.5;
        }

        .bio-text, .phone-text {
            font-weight: 500;
            color: #1f1b3e;
            word-break: break-word;
        }

        .bio-text {
            font-weight: 450;
            line-height: 1.5;
        }

        .badge-light {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.3rem 1.6rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            color: #4b3d8a;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .badge-light i {
            margin-right: 6px;
            color: #7c3aed;
        }

        /* Edit Profile Button - Matching Dashboard Buttons */
        .edit-profile-btn {
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.3);
        }

        .edit-profile-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(107, 70, 193, 0.5);
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .profile-card {
                padding: 2rem 1.2rem 2.2rem;
                border-radius: 32px;
            }
            .avatar-wrapper, .avatar-img, .fallback-avatar {
                width: 110px;
                height: 110px;
            }
            .username {
                font-size: 1.8rem;
            }
            .info-group {
                padding: 1rem 1.2rem;
            }
            
            .navbar {
                padding: 0.6rem 1rem;
                border-radius: 40px;
            }
            
            .navbar-brand {
                font-size: 0.95rem;
            }
            
            .navbar-brand span {
                display: none;
            }
            
            .nav-link {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
            
            .nav-link span {
                display: none;
            }
            
            .nav-divider {
                height: 18px;
            }
            
            .edit-profile-btn {
                padding: 0.7rem 1.5rem;
                font-size: 0.85rem;
            }
        }

        .profile-card * {
            transition: all 0.15s ease;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: #a78bfa;
            border-radius: 20px;
        }

        .no-avatar-text {
            color: #6d5fd3;
            font-weight: 500;
            padding: 0.5rem;
        }
    </style>
</head>
<body>

<!-- Navigation Bar - Same style as other tabs -->
<nav class="navbar">
    <a href="#" class="navbar-brand">
        <i class="fas fa-heartbeat"></i>
        <span>Aurea Clinic</span>
    </a>
    <ul class="nav-links">
        <li>
            <a href="#" class="nav-link">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="#" class="nav-link">
                <i class="fas fa-users"></i>
                <span>Patients</span>
            </a>
        </li>
        <li>
            <a href="#" class="nav-link">
                <i class="fas fa-calendar-check"></i>
                <span>Appointments</span>
            </a>
        </li>
        <li>
            <a href="#" class="nav-link active">
                <i class="fas fa-user-circle"></i>
                <span>Profile</span>
            </a>
        </li>
    </ul>
</nav>

<!-- Profile Card -->
<div class="profile-card">
    <!-- Avatar section with proper Django if/else syntax -->
    <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        
        {% if profile.avatar %}
            <img 
                src="{{ profile.avatar.url }}" 
                alt="Profile Picture"
                class="avatar-img"
                width="140"
                height="140"
            >
        {% else %}
            <div class="fallback-avatar">
                <i class="fas fa-user-astronaut"></i>
            </div>
        {% endif %}
    </div>

    <!-- Username -->
    <h2 class="username">{{ profile.user.username }}</h2>

    <!-- Bio & Phone inside a glass card -->
    <div class="info-group">
        <div class="info-item">
            <i class="fas fa-quote-left"></i>
            <span class="bio-text"><strong>Bio:</strong> {{ profile.bio|default:"No bio provided yet." }}</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
            <i class="fas fa-phone-alt"></i>
            <span class="phone-text"><strong>Phone:</strong> {{ profile.phone|default:"Not specified" }}</span>
        </div>
    </div>

    <!-- subtle decorative badge -->
    <div class="badge-light">
        <i class="fas fa-circle-check"></i> verified · active
    </div>

    <!-- Edit Profile Button - Matching dashboard buttons -->
    <a href="#" class="edit-profile-btn">
        <i class="fas fa-pen"></i> Edit Profile
    </a>
</div>

</body>
</html>
