{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-user-md"></i> Add Doctor</h1>
        </div>

        <div class="booking-card">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Name</label>
                    <input type="text" name="name" placeholder="Enter doctor name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-stethoscope"></i> Specialization</label>
                    <input type="text" name="specialization" placeholder="Enter specialization" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone</label>
                    <input type="text" name="phone" placeholder="Enter phone number" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" name="email" placeholder="Enter email" class="form-input" required>
                </div>
                <div class="form-actions">
                    <a href="{% url 'doctor_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Add Doctor
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
