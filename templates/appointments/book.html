{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-calendar-plus"></i> Book Appointment</h1>
        </div>

        {% if messages %}
            <div class="success-message">
                {% for message in messages %}
                    <p><i class="fas fa-check-circle"></i> {{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="booking-card">
            <form method="POST" action="">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Patient</label>
                        <select name="patient" class="form-input" required>
                            <option value="">Select Patient</option>
                            {% for patient in patients %}
                            <option value="{{ patient.id }}">{{ patient.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-md"></i> Doctor</label>
                        <select name="doctor" class="form-input" required>
                            <option value="">Select Doctor</option>
                            {% for doctor in doctors %}
                            <option value="{{ doctor.id }}">Dr. {{ doctor.name }} - {{ doctor.specialization }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar-day"></i> Date</label>
                        <input type="date" name="date" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Time</label>
                        <input type="time" name="time" class="form-input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-comment"></i> Reason</label>
                    <input type="text" name="reason" placeholder="Reason for appointment" class="form-input">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Status</label>
                    <select name="status" class="form-input">
                        <option value="Pending">Pending</option>
                        <option value="Confirmed">Confirmed</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="{% url 'appointment_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> Book Appointment
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
